name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev

env:
  IMAGE_REPO: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
  IMAGE_TAG: ${{ github.head_ref || github.ref_name }}-${{ github.sha }}
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.head_ref || github.ref_name }}-${{ github.sha }}
  BRANCH_TAG: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.head_ref || github.ref_name }}
  DEPLOY_DIR: /root/srv/${{ github.event.repository.name }}/${{ github.head_ref || github.ref_name }}
  DEPLOY_FILE: docker-stack.yml
  STACK_NAME: ${{ github.event.repository.name }}-${{ github.head_ref || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          IMAGE=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          BRANCH=$(echo "${{ env.BRANCH_TAG }}" | tr '[:upper:]' '[:lower:]')
          # Immutable per-commit tag (drives the actual deploy)
          docker build -t $IMAGE -t $BRANCH .
          docker push $IMAGE
          # Also update the convenience :branch tag so manual `docker pull` works
          docker push $BRANCH

      - name: Ensure deploy directory exists on server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ${{ env.DEPLOY_DIR }}

      - name: Copy docker stack to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ${{ env.DEPLOY_FILE }}
          target: ${{ env.DEPLOY_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy stack
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            ENV_FILE="${{ env.DEPLOY_DIR }}/.env"
            STACK_FILE="${{ env.DEPLOY_DIR }}/${{ env.DEPLOY_FILE }}"

            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: .env file not found at $ENV_FILE"
              exit 1
            fi

            set -a
            source "$ENV_FILE"
            set +a

            export IMAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

            # Ensure the server can pull (private images / forwarded auth to swarm workers)
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "Pulling latest image..."
            docker pull $IMAGE_NAME

            echo "Deploying stack ${{ env.STACK_NAME }} with image $IMAGE_NAME"
            cd "${{ env.DEPLOY_DIR }}"
            envsubst < "$STACK_FILE" | docker stack deploy --with-registry-auth --resolve-image always --compose-file - ${{ env.STACK_NAME }}
            echo "Deployment finished. Services:"
            docker stack services ${{ env.STACK_NAME }}

            # Confirm what image is actually running now (debug log)
            docker service inspect "${{ env.STACK_NAME }}_app" --format 'Running image: {{.Spec.TaskTemplate.ContainerSpec.Image}}' || true

  health-check:
    runs-on: ubuntu-latest
    needs: deploy
    outputs:
      health_message: ${{ steps.health.outputs.health_message }}
    steps:
      - name: Wait for app to boot
        run: sleep 30

      - name: Health Check
        id: health
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            URL="http://${{ secrets.SERVER_HOST }}:3001/api/v1/health-check"
          else
            URL="http://${{ secrets.SERVER_HOST }}:3000/api/v1/health-check"
          fi

          MAX_ATTEMPTS=5
          ATTEMPT=1
          HEALTH="❌ Health check failed"
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Checking $URL"
            if curl -s -f --max-time 5 "$URL" > /dev/null; then
              HEALTH="✅ Application is healthy!"
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            sleep 5
          done

          echo "health_message=$HEALTH" >> $GITHUB_OUTPUT

  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy, health-check]
    if: always()
    steps:
      - name: Format status messages
        id: format
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "build_message=✅ Success" >> $GITHUB_OUTPUT
          else
            echo "build_message=❌ Failed" >> $GITHUB_OUTPUT
          fi

          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "deploy_message=✅ Success" >> $GITHUB_OUTPUT
          else
            echo "deploy_message=❌ Failed" >> $GITHUB_OUTPUT
          fi

      - name: Alert to telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🧑‍💻 Username: ${{ github.actor }}
            💬 Commit: ${{ github.event.commits[0].message }}
            📦 Repository: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            🏗️ Build status: ${{ steps.format.outputs.build_message }}
            🖥️ Deployment status: ${{ steps.format.outputs.deploy_message }}
            🏥 Health status: ${{ needs.health-check.outputs.health_message }}
            🔗 Changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
