version: '3.8'

services:
  app:
    image: ${IMAGE_NAME}
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
    ports:
      - ${PORT}:${PORT}
    env_file: .env
    networks:
      - network
      - postgres
      - redis

networks:
  network:
    driver: overlay
    attachable: true

  postgres:
    external: true
    name: postgres_network

  redis:
    external: true
    name: redis_network
